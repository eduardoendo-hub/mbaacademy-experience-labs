server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Pagina unica — qualquer rota cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com cache longo (imagens versionadas pelo deploy)
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # gzip basico
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
